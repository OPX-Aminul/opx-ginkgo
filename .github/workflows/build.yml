name: OPX NetHunter Kernel Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y -qq \
            bc bison flex libssl-dev libelf-dev device-tree-compiler \
            gcc-aarch64-linux-gnu kmod zip unzip git curl ca-certificates

      - name: Install Neutron Clang 10032024
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman \
            -o /tmp/antman.sh
          TC_DIR="$HOME/toolchains/clang-10032024"
          mkdir -p "$TC_DIR"
          cd "$TC_DIR"
          bash /tmp/antman.sh -S=10032024
          bash /tmp/antman.sh --patch=glibc
          echo "TC_DIR=$TC_DIR" >> "$GITHUB_ENV"
          "$TC_DIR/bin/clang" --version

      - name: Cache toolchain + kernel build outputs
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/out
            ${{ github.workspace }}/toolchains/clang-10032024
            ${{ github.workspace }}/toolchains/system
          key: ${{ runner.os }}-opx-kernel-${{ hashFiles('arch/arm64/configs/nethunter_defconfig','build.sh') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-opx-kernel-

      - name: Build kernel and packages
        run: |
          bash build.sh
          ls -lh out/*.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opx-nethunter-${{ github.run_number }}
          path: out/opx-nethunter-*.zip
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION)"
          STAMP="$(cat out/BUILD_STAMP)"
          TAG="opx-nethunter-v${VERSION}-${STAMP}-${GITHUB_RUN_NUMBER}"
          GZIP="$(sed -n 1p out/ARTIFACTS)"
          MZIP="$(sed -n 2p out/ARTIFACTS)"
          FZIP="$(sed -n 3p out/ARTIFACTS)"
          NOTES="Automated NetHunter kernel build for ginkgo/willow.

          Assets:
          - ${GZIP}  (Kernel / AnyKernel3)
          - ${MZIP}  (Magisk modules)
          - ${FZIP}  (USB WiFi firmware)

          Flash guide: docs/FLASH.md"
          gh release create "$TAG" \
            --title "OPX NetHunter v${VERSION} (${STAMP})" \
            --notes "$NOTES" \
            out/${GZIP} \
            out/${MZIP} \
            out/${FZIP}
          echo "Release created: $TAG"
